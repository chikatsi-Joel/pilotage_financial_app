</button>

<script>
  document.addEventListener('DOMContentLoaded', () => {
      // Gestion des catégories
      const categoryBtns = document.querySelectorAll('.category-btn');
      categoryBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
              // Retirer la classe active de tous
              categoryBtns.forEach(b => b.classList.remove('active'));
              // L'ajouter au cliqué
              btn.classList.add('active');
              
              // Petit effet haptique visuel
              btn.style.transform = 'scale(0.95)';
              setTimeout(() => btn.style.transform = 'scale(1)', 150);
          });
      });
      
      // Gestion du bouton "Plus" (simulation simple)
      const moreBtn = document.getElementById('more-cat-btn');
      const hiddenCats = document.querySelectorAll('.hidden-cat');
      
      // Cacher initialement (fait en CSS en prod, ici en JS pour l'exemple sans <style>)
      hiddenCats.forEach(cat => cat.style.display = 'none');
      
      moreBtn.addEventListener('click', () => {
          const isHidden = hiddenCats[0].style.display === 'none';
          hiddenCats.forEach(cat => cat.style.display = isHidden ? 'flex' : 'none');
          moreBtn.querySelector('span:last-child').textContent = isHidden ? 'Moins' : 'Plus';
          moreBtn.querySelector('.material-symbols-outlined').textContent = isHidden ? 'expand_less' : 'more_horiz';
      });

      // Gestion du pavé numérique
      const display = document.getElementById('amount-display');
      let currentAmount = '0';
      
      const updateDisplay = () => {
          display.textContent = currentAmount;
          // Animation subtile
          display.classList.remove('scale-105', 'text-primary');
          void display.offsetWidth; // trigger reflow
          display.classList.add('scale-105', 'text-primary', 'transition-all', 'duration-100');
          setTimeout(() => {
              display.classList.remove('scale-105', 'text-primary');
          }, 150);
      };

      document.querySelectorAll('.numpad-btn').forEach(btn => {
          btn.addEventListener('click', () => {
              const val = btn.textContent.trim();
              
              if (val === ',') {
                  if (!currentAmount.includes(',')) {
                      currentAmount += ',';
                  }
              } else {
                  if (currentAmount === '0') {
                      currentAmount = val;
                  } else {
                      // Limiter la taille (ex: max 7 caractères)
                      if(currentAmount.length < 7) {
                           currentAmount += val;
                      }
                  }
              }
              updateDisplay();
          });
      });

      document.getElementById('btn-delete').addEventListener('click', () => {
          if (currentAmount.length > 1) {
              currentAmount = currentAmount.slice(0, -1);
          } else {
              currentAmount = '0';
          }
          updateDisplay();
      });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-white/90 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="flex justify-between items-center h-16 px-gutter"><a aria-current="page" class="flex flex-col items-center gap-xs transition-colors text-primary font-bold" data-path="tableau-de-bord" href="#"><span class="material-symbols-outlined">dashboard</span><span class="font-label-sm text-label-sm">Dashboard</span></a><a class="flex flex-col items-center gap-xs text-on-surface-variant transition-colors" data-path="analyse" href="#"><span class="material-symbols-outlined">insights</span><span class="font-label-sm text-label-sm">Analyse</span></a><a class="flex flex-col items-center gap-xs text-on-surface-variant transition-colors" data-path="budget" href="#"><span class="material-symbols-outlined">account_balance_wallet</span><span class="font-label-sm text-label-sm">Budget</span></a><a class="flex flex-col items-center gap-xs text-on-surface-variant transition-colors" data-path="epargne" href="#"><span class="material-symbols-outlined">savings</span><span class="font-label-sm text-label-sm">Épargne</span></a></div></nav>
