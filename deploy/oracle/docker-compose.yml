# Production sur la VM (Google Cloud / Oracle, Ubuntu) : Postgres + API + Caddy (HTTPS Let's Encrypt).
# Lancement depuis ce dossier : docker compose up -d --build
# Seul Caddy est exposé (80/443) ; Postgres et l'API restent sur le réseau Docker interne.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=1000
      - -c
      - pg_stat_statements.track_utility=off
      # Réglages pour 1 Go de RAM (e2-micro), partagés avec l'API et Caddy.
      - -c
      - max_connections=25
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finance:${POSTGRES_PASSWORD}@db:5432/finance
      ENVIRONMENT: production
      # Caddy est le seul client : on lui fait confiance pour l'IP réelle (limites de connexion admin).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # Garde-fou : un pic mémoire de l'analytique ne doit pas faire tomber Postgres (OOM).
    mem_limit: 600m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
